; Config overlay merged via `PPSSPPSDL --appendconfig` for DETERMINISTIC, PSP-faithful
; frame capture in the BSP ground-truth loop (ppsspp-shoot.ts). The goal is to match
; the PSP's fixed-function GE output as closely as the emulator allows, so a captured
; frame is comparable to the WebGL/oracle ground truth:
;   - SoftwareRenderer: the hardware-closest path (nearest by default, locked 1x,
;     ignores upscaling/MSAA, reproduces dithering + low blend precision).
;   - InternalResolution = 1: native 480x272 framebuffer (ScreenshotMode=1 dumps it 1:1).
;   - TextureFiltering = 1: nearest (PSP has no mip/anisotropic world filtering here).
; Everything that would "improve" on the PSP (upscale, smoothing, MSAA, frameskip) is off
; so the diff measures fidelity to the device, not emulator enhancement.
[Graphics]
SoftwareRenderer = True
SoftwareRendererJit = True
InternalResolution = 1
TextureFiltering = 1
Smart2DTexFiltering = False
TexScalingLevel = 1
TexScalingType = 0
TexDeposterize = False
MultiSampleLevel = 0
FrameSkip = 0
AutoFrameSkip = False
VerticalSync = False
FrameRate = 60
[General]
ScreenshotsAsPNG = True
ScreenshotMode = 1
