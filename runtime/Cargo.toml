[package]
name = "dreamcart-runtime"
version = "0.1.0"
authors = ["Yifeng Wang <doodlewind@gmail.com>"]
edition = "2018"

[dependencies]
psp = { path = "../rust-psp/psp", features = ["external-c-heap", "abort-only"] }
libquickjs-sys = { path = "../quickjs-rs/libquickjs-sys" }
linked_list_allocator = { version = "=0.9.1", default-features = false }

[features]
# Capture build for the BSP ground-truth loop: after each presented frame, emit the
# display framebuffer to the PPSSPP *headless* host (sceIoDevctl "emulator:" 0x20) so it
# can be dumped + diffed against the WebGL/oracle ground truth. No-op on real hardware
# and the GUI emulator; only PPSSPPHeadless consumes it. Built on demand by
# framework/test/bsp-compare/ppsspp-shoot.ts, never by the normal `bun psp` path.
capture = []

[build-dependencies]
cc = "1.0"
